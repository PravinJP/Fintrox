version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: fintrox_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}          # ✅ From .env
      POSTGRES_USER: ${POSTGRES_USER}      # ✅ From .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # ✅ From .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fintrox_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fintrox_redis
    ports:
      - "6379:6379"
    networks:
      - fintrox_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrox_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - fintrox_network

volumes:
  postgres_data:
    name: fintrox_postgres_data

networks:
  fintrox_network:
    name: fintrox_network
    driver: bridge