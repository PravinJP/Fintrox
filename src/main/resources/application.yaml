spring:
  application:
    name: Fintrox

  # ===== Database Configuration =====
  datasource:
    url: jdbc:postgresql://localhost:5432/Fintrox
    username: postgres
    password: pravin@21
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000

  # ===== JPA / Hibernate Configuration =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ===== H2 Console (Development Only) =====
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ===== Jackson Configuration =====
  jackson:
    serialization:
      fail-on-empty-beans: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Kolkata
    date-format: yyyy-MM-dd HH:mm:ss

  # ===== Servlet Configuration =====
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

  # ===== Logging Configuration =====
  output:
    ansi:
      enabled: always

# ===== Server Configuration =====
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-exception: false
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  servlet:
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ===== JWT Configuration =====
jwt:
  secret: 432tyfhc2f4c2c0vncu0c928utv820cv72untv0928ut2n9t8utmmc32u0
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds
  reset-expiration: 3600000  # 1 hour in milliseconds

# ===== Logging Configuration =====
logging:
  level:
    com.Fintrox: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/Fintrox.log
    max-size: 10MB
    max-history: 7

# ===== Actuator Configuration =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always

# ===== CORS Configuration (Spring Security handles this) =====
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:4200
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin
    - X-Requested-With
  exposed-headers:
    - Authorization
  allow-credentials: true
  max-age: 3600

# ===== API Documentation =====
api:
  title: Fintrox API
  version: 1.0.0
  description: Finance Management Platform API
  contact:
    name: Fintrox Team
    email: support@fintrox.com